<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Shrouk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --pink:#ff5c8a;
    --pink-soft:#ffb3c6;
    --gold:#ffd9a0;
    --cream:#fff3f6;
    --dim:#caa0ad;
  }
  html{scroll-behavior:smooth;}
  body{
    background:radial-gradient(ellipse at 50% 30%, #3a0c22 0%, #1a0512 55%, #0d0209 100%);
    color:var(--cream);
    font-family:'Cormorant Garamond',Georgia,serif;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .stars{position:fixed;inset:0;z-index:0;overflow:hidden;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  .bokeh{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;
    animation:drift 14s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-30px) translateX(20px);}}

  .hero{
    min-height:100vh;position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }

  .heart-wrap{position:relative;width:240px;height:220px;}
  .heart{
    position:relative;width:100%;height:100%;
    animation:beat 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 35px rgba(255,92,138,.65)) drop-shadow(0 0 70px rgba(255,92,138,.3));
  }
  .heart::before,.heart::after{
    content:"";position:absolute;top:0;left:120px;width:120px;height:196px;
    background:linear-gradient(155deg,#ff86a8,var(--pink) 55%,#c9184a);
    border-radius:120px 120px 0 0;transform-origin:0 100%;
  }
  .heart::before{transform:rotate(-45deg);}
  .heart::after{left:0;transform-origin:100% 100%;transform:rotate(45deg);}
  @keyframes beat{
    0%,100%{transform:scale(1);}
    22%{transform:scale(1.1);}
    38%{transform:scale(0.97);}
    55%{transform:scale(1.12);}
    72%{transform:scale(1);}
  }

  .heart-text{
    position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);
    z-index:3;font-family:'Great Vibes',cursive;font-size:2.1rem;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.55);white-space:nowrap;
  }

  .hero p.hint{
    margin-top:3.2rem;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:1rem;letter-spacing:.08em;color:var(--dim);
    animation:fadepulse 2.5s ease-in-out infinite;
  }
  @keyframes fadepulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  .reveal{
    min-height:100vh;position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:4rem 1.5rem;
  }
  .reveal h1{
    font-family:'Great Vibes',cursive;font-size:clamp(3.5rem,14vw,8rem);
    color:var(--gold);
    text-shadow:0 0 25px rgba(255,217,160,.5), 0 0 60px rgba(255,92,138,.3);
    opacity:0;transform:translateY(30px);transition:opacity 1s ease, transform 1s ease;
  }
  .reveal h1.in{opacity:1;transform:translateY(0);}

  .reveal .message{
    margin-top:2.2rem;max-width:38ch;
    font-size:clamp(1.3rem,3.5vw,1.75rem);line-height:1.75;color:var(--cream);
    opacity:0;transform:translateY(20px);transition:opacity 1s ease .3s, transform 1s ease .3s;
  }
  .reveal .message.in{opacity:1;transform:translateY(0);}

  .reveal .signature{
    margin-top:2.6rem;font-family:'Great Vibes',cursive;font-size:1.8rem;color:var(--pink-soft);
    opacity:0;transition:opacity 1s ease .7s;
  }
  .reveal .signature.in{opacity:1;}

  .petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{position:absolute;top:-8%;animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(112vh) rotate(360deg);}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="bokeh" id="bokeh"></div>
<div class="petals" id="petals"></div>

<section class="hero">
  <div class="heart-wrap">
    <div class="heart"></div>
    <div class="heart-text">I love you</div>
  </div>
  <p class="hint">scroll down, my love</p>
</section>

<section class="reveal">
  <h1 id="name">Shrouk</h1>
  <p class="message" id="msg">
    I love you so much, my princess, my queen. You are my angel, today, tomorrow, and every day after.
  </p>
  <p class="signature" id="sig">— Abdallah</p>
</section>

<script>
const starField = document.getElementById('stars');
for(let i=0;i<120;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2 + 0.5;
  s.style.width = size+'px';
  s.style.height = size+'px';
  s.style.left = Math.random()*100+'vw';
  s.style.top = Math.random()*100+'vh';
  s.style.animationDuration = (2+Math.random()*3)+'s';
  s.style.animationDelay = (Math.random()*3)+'s';
  starField.appendChild(s);
}

const bokeh = document.getElementById('bokeh');
const orbColors = ['#ff5c8a','#ffd9a0','#ff8fb3'];
for(let i=0;i<6;i++){
  const o = document.createElement('div');
  o.className = 'orb';
  const size = 120+Math.random()*180;
  o.style.width = size+'px';
  o.style.height = size+'px';
  o.style.left = Math.random()*90+'vw';
  o.style.top = Math.random()*90+'vh';
  o.style.background = orbColors[i % orbColors.length];
  o.style.animationDuration = (10+Math.random()*10)+'s';
  o.style.animationDelay = (Math.random()*5)+'s';
  bokeh.appendChild(o);
}

const container = document.getElementById('petals');
const symbols = ['♥','❤','♡','✧'];
for(let i=0;i<28;i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
  p.style.left = Math.random()*100 + 'vw';
  p.style.fontSize = (0.7 + Math.random()*1.6) + 'rem';
  p.style.opacity = 0.35 + Math.random()*0.5;
  p.style.animationDuration = (7 + Math.random()*9) + 's';
  p.style.animationDelay = (Math.random()*12) + 's';
  p.style.color = Math.random() > 0.5 ? '#ff5c8a' : '#ffd9a0';
  container.appendChild(p);
}

const targets = ['name','msg','sig'].map(id=>document.getElementById(id));
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
}, {threshold:0.4});
targets.forEach(t=>io.observe(t));
</script>
</body>
</html>
